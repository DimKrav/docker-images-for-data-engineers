networks:
  data-stack:
    driver: bridge

services:
  # --- HADOOP: Storage ---
  namenode:
    image: bde2020/hadoop-namenode:2.0.0-hadoop3.2.1-java8
    container_name: namenode
    volumes:
      - namenode:/hadoop/dfs/name
    environment:
      - CLUSTER_NAME=test
    env_file:
      - ./hadoop.env
    ports:
      - "9870:9870"
      - "9000:9000"
    networks:
      - data-stack

  datanode:
    image: bde2020/hadoop-datanode:2.0.0-hadoop3.2.1-java8
    container_name: datanode
    volumes:
      - datanode:/hadoop/dfs/data
    env_file:
      - ./hadoop.env
    environment:
      SERVICE_PRECONDITION: "namenode:9870"
      CORE_CONF_fs_defaultFS: hdfs://namenode:9000
    ports:
      - "9864:9864"
    networks:
      - data-stack

  # --- S3: Object Storage ---
  minio:
    image: minio/minio
    container_name: minio
    ports:
      - "9001:9001" # Console UI
      - "9002:9000" # API
    environment:
      MINIO_ROOT_USER: admin
      MINIO_ROOT_PASSWORD: password
    command: server /data --console-address ":9001"
    networks:
      - data-stack

  # --- SPARK & JUPYTER ---
  spark-master:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-master
    user: root
    ports:
      - "8080:8080"
      - "7077:7077"
    environment:
      - SPARK_MODE=master
      - HADOOP_CONF_DIR=/etc/hadoop
    volumes:
      - ./notebooks:/home/jovyan/work
    networks:
      - data-stack
    command: /usr/local/spark/bin/spark-class org.apache.spark.deploy.master.Master

  spark-worker:
    image: jupyter/pyspark-notebook:latest
    container_name: spark-worker
    user: root
    depends_on:
      - spark-master
    environment:
      - SPARK_MASTER=spark://spark-master:7077
      - SPARK_WORKER_CORES=1
      - SPARK_WORKER_MEMORY=1G
    networks:
      - data-stack
    command: start-worker.sh spark://spark-master:7077
    
  jupyter:
    image: jupyter/pyspark-notebook:latest
    container_name: jupyter-spark
    ports:
      - "8888:8888"
      - "4040:4040"
    volumes:
      - ./notebooks:/home/jovyan/work
    environment:
      - JUPYTER_ENABLE_LAB=yes
      - JUPYTER_TOKEN=password
      - PYSPARK_SUBMIT_ARGS=--packages org.apache.hadoop:hadoop-aws:3.3.4,com.amazonaws:aws-java-sdk-bundle:1.12.262 pyspark-shell
    networks:
      - data-stack

  # --- AIRFLOW: Orchestration ---
  postgres:
    image: postgres:13
    container_name: airflow-db
    environment:
      - POSTGRES_USER=airflow
      - POSTGRES_PASSWORD=airflow
      - POSTGRES_DB=airflow
    networks:
      - data-stack

  airflow-init:
    image: apache/airflow:2.7.1-python3.10
    depends_on:
      - postgres
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
    # Эта команда инициализирует БД и создает админа автоматически
    command: >
      bash -c "airflow db init &&
      airflow users create --username admin --password admin --firstname Jack --lastname Sparrow --role Admin --email admin@example.com"
    networks:
      - data-stack

  airflow-webserver:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-webserver
    depends_on:
      - airflow-init # Теперь ждем завершения инициализации
    volumes:
      - ./dags:/opt/airflow/dags 
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    ports:
      - "8085:8080"
    command: webserver
    restart: always # Если упадет — поднимется сам
    networks:
      - data-stack

  airflow-scheduler:
    image: apache/airflow:2.7.1-python3.10
    container_name: airflow-scheduler
    depends_on:
      - airflow-init
    environment:
      - AIRFLOW__DATABASE__SQL_ALCHEMY_CONN=postgresql+psycopg2://airflow:airflow@postgres/airflow
      - AIRFLOW__CORE__EXECUTOR=LocalExecutor
    volumes:
      - ./dags:/opt/airflow/dags 
    command: scheduler
    restart: always
    networks:
      - data-stack

volumes:
  namenode:
  datanode: